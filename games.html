<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Games | Nexus Arcade</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body class="inner"><div id="nav"></div><section class="phead"><div class="container"><h1 class="rv">All games</h1><p class="mu">Search, filter and sort the full library.</p></div></section>
<div class="fbar"><div class="container"><div class="row g-2 align-items-center"><div class="col-lg-4"><input id="q" class="form-control" placeholder="Search game, studio or tag…"></div><div class="col-6 col-lg-2"><select id="pf" class="form-select"><option value="">All platforms</option></select></div><div class="col-6 col-lg-2"><select id="s" class="form-select"><option value="0">Featured</option><option value="1">Top rated</option><option value="2">Price: low to high</option><option value="3">Price: high to low</option><option value="4">Newest</option></select></div><div class="col-lg-4 text-lg-end mu" id="cnt"></div></div><div class="d-flex flex-wrap gap-2 mt-3" id="chips"></div></div></div>
<section class="sec pt-4"><div class="container"><div class="row g-3 g-lg-4" id="grid"></div></div></section><div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/main.js"></script><script>
const gs=["All",...new Set(G.map(x=>x.g))];let gen=new URLSearchParams(location.search).get("g")||"All";if(!gs.includes(gen))gen="All";
$("#pf").innerHTML+=[...new Set(G.flatMap(x=>x.pl))].map(p=>`<option>${p}</option>`).join("");
function chips(){$("#chips").innerHTML=gs.map(x=>`<button class="chip ${x==gen?"on":""}" data-g="${x}">${x}</button>`).join("")}
$("#chips").onclick=e=>{const b=e.target.closest(".chip");if(b){gen=b.dataset.g;chips();draw()}};
function draw(){const q=$("#q").value.toLowerCase(),p=$("#pf").value,s=$("#s").value;let a=G.filter(x=>(gen=="All"||x.g==gen)&&(!p||x.pl.includes(p))&&(x.n+x.dev+x.tg.join(" ")).toLowerCase().includes(q));const so={1:(x,y)=>y.r-x.r,2:(x,y)=>x.p-y.p,3:(x,y)=>y.p-x.p,4:(x,y)=>y.y-x.y};if(so[s])a.sort(so[s]);$("#cnt").textContent=a.length+" games";$("#grid").innerHTML=a.length?a.map(card).join(""):`<p class="empty">No games match. Try another search or filter.</p>`;reveal()}
$("#q").oninput=$("#pf").onchange=$("#s").onchange=draw;chips();draw();</script></body></html>
