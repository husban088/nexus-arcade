<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game | Nexus Arcade</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body class="inner"><div id="nav"></div><header class="gh" id="gh"></header>
<section class="sec pt-4"><div class="container"><div class="row g-4"><div class="col-lg-8"><h2>About this game</h2><p class="mu fs-5" id="ab"></p><h3 class="mt-4">Key features</h3><ul class="hl" id="ft"></ul><h3 class="mt-5 mb-3">Screenshots</h3><div class="row g-3" id="gal"></div></div><div class="col-lg-4"><div class="box" id="sp"></div></div></div>
<h2 class="mt-5 mb-4">You may also like</h2><div class="row g-3 g-lg-4" id="rel"></div></div></section><div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/main.js"></script><script>
const g=G.find(x=>x.id==new URLSearchParams(location.search).get("id"))||G[0],on=W().includes(g.id);document.title=g.n+" | Nexus Arcade";
$("#gh").innerHTML=`${pic(g,"hero","bg")}<div class="container"><div class="row g-4 align-items-end"><div class="col-6 col-md-4 col-lg-3">${pic(g,"cover","cover")}</div><div class="col-md-8 col-lg-9"><div class="mb-3"><span class="pill">${g.g}</span>${g.tg.map(t=>`<span class="pill">${t}</span>`).join("")}</div><h1>${g.n}</h1><div class="d-flex flex-wrap gap-3 my-3 mu"><span class="stars"><i class="bi bi-star-fill"></i> ${g.r} / 10</span><span>${g.y}</span><span>${g.dev}</span><span>${g.pc}</span></div><div class="price mb-3">${money(g.p)}</div><div class="d-flex flex-wrap gap-3"><a class="btn btn-nx" target="_blank" rel="noopener" href="https://store.steampowered.com/app/${g.a}">Get this game</a><button class="btn btn-line ${on?"on":""}" data-w="${g.id}"><i class="bi bi-heart-fill"></i> <span class="wt">${on?"In your wishlist":"Add to wishlist"}</span></button></div></div></div></div>`;
$("#ab").textContent=g.t;$("#ft").innerHTML=g.f.map(x=>`<li>${x}</li>`).join("");
$("#gal").innerHTML=["s1","s2","s3"].map(k=>`<div class="col-md-4"><div class="gp">${pic(g,k,"")}</div></div>`).join("");
$("#sp").innerHTML=[["Developer",g.dev],["Release year",g.y],["Genre",g.g],["Players",g.pc],["Platforms",g.pl.join(", ")],["Price",money(g.p)],["Our rating",g.r+" / 10"]].map(s=>`<div class="spec"><span>${s[0]}</span><b class="text-end">${s[1]}</b></div>`).join("");
$("#rel").innerHTML=G.filter(x=>x.id!=g.id).sort((a,b)=>(b.g==g.g)-(a.g==g.g)||b.r-a.r).slice(0,4).map(card).join("");reveal();</script></body></html>
