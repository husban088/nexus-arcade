<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | Nexus Arcade</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body class="inner"><div id="nav"></div><section class="phead"><div class="container" style="max-width:820px"><h1 class="rv">Contact us</h1><p class="mu">Suggest a game, report a problem or just say hi.</p><form id="f" class="box mt-4 needs-validation" novalidate><div class="row g-3"><div class="col-md-6"><input id="n" class="form-control" placeholder="Your name" required></div><div class="col-md-6"><input id="e" type="email" class="form-control" placeholder="Email" required></div><div class="col-12"><select id="t" class="form-select"><option>Suggest a game</option><option>Report a problem</option><option>General question</option></select></div><div class="col-12"><textarea id="m" rows="5" class="form-control" placeholder="Your message" required></textarea></div><div class="col-12"><button class="btn btn-nx">Send message</button></div></div></form></div></section><div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/main.js"></script><script>$("#f").onsubmit=e=>{e.preventDefault();const f=e.target;if(!f.checkValidity()){f.classList.add("was-validated");return}let a=[];try{a=JSON.parse(localStorage.getItem("nx_messages")||"[]")}catch(x){}a.push({n:$("#n").value.trim(),e:$("#e").value.trim(),t:$("#t").value,m:$("#m").value.trim(),at:Date.now()});localStorage.setItem("nx_messages",JSON.stringify(a));f.reset();f.classList.remove("was-validated");toast("Message sent. Thank you!")};reveal()</script></body></html>
