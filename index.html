<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home | Nexus Arcade</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body class=""><div id="nav"></div><header class="hero"><div id="slides"></div><div class="thumbs" id="thumbs"></div><div class="prog" id="prog"></div></header>
<section class="sec"><div class="container"><div class="d-flex justify-content-between align-items-end mb-4 rv"><div><h2>Browse by genre</h2><p class="mu m-0">Pick a style and jump straight in.</p></div></div><div class="row g-3" id="gen"></div></div></section>
<section class="sec pt-0"><div class="container"><div class="d-flex justify-content-between align-items-end mb-4 rv"><h2 class="m-0">Trending now</h2><a href="games.html" class="btn btn-line btn-sm">See all games</a></div><div class="row g-3 g-lg-4" id="tr"></div></div></section>
<section class="sec grid-bg"><div class="container"><div class="row g-4 text-center" id="st"></div></div></section>
<section class="sec"><div class="container"><h2 class="mb-4 rv">Top rated of all time</h2><div class="row g-3" id="top"></div></div></section>
<section class="sec pt-0"><div class="container"><div class="cta rv"><h2>Found your next game?</h2><p class="mu mb-4">Save it to your wishlist and come back any time.</p><a href="games.html" class="btn btn-nx">Browse all games</a></div></div></section><div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/main.js"></script><script>
const F=["cyberpunk-2077","elden-ring","red-dead-2","baldurs-gate-3","god-of-war"].map(i=>G.find(x=>x.id==i));
$("#slides").innerHTML=F.map((g,i)=>`<div class="slide ${i?"":"on"}">${pic(g,"hero","bg")}<div class="txt"><div class="container"><div class="mb-3"><span class="pill">${g.g}</span>${g.tg.slice(0,2).map(t=>`<span class="pill">${t}</span>`).join("")}</div><h1>${g.n}</h1><p class="lead mu my-3" style="max-width:560px">${g.t}</p><div class="d-flex flex-wrap align-items-center gap-3"><a class="btn btn-nx" href="game.html?id=${g.id}">View game details</a><span class="stars"><i class="bi bi-star-fill"></i> ${g.r} / 10</span></div></div></div></div>`).join("");
$("#thumbs").innerHTML=F.map((g,i)=>`<button class="${i?"":"on"}" data-i="${i}" aria-label="${g.n}">${pic(g,"cover","")}</button>`).join("");
let cur=0,tm;function go(i){cur=(i+F.length)%F.length;$$(".slide").forEach((s,j)=>s.classList.toggle("on",j==cur));$$("#thumbs button").forEach((s,j)=>s.classList.toggle("on",j==cur));const p=$("#prog");p.classList.remove("run");void p.offsetWidth;p.classList.add("run");clearTimeout(tm);tm=setTimeout(()=>go(cur+1),6000)}
$("#thumbs").onclick=e=>{const b=e.target.closest("button");if(b)go(+b.dataset.i)};go(0);
const GN=[["RPG","#7c5cff","#2a1a6e","bi-shield-shaded"],["Action","#ff4d6d","#5a1030","bi-lightning-charge-fill"],["Shooter","#22e1ff","#0b4a5c","bi-bullseye"],["Indie","#3fd6a0","#0f4a3a","bi-stars"],["Multiplayer","#d9b76a","#5a4514","bi-people-fill"]];
$("#gen").innerHTML=GN.map(x=>`<div class="col-6 col-md-4 col-lg rv"><a class="genre" href="games.html?g=${x[0]}" style="--c1:${x[1]};--c2:${x[2]}"><i class="bi ${x[3]}"></i><h3>${x[0]}</h3></a></div>`).join("");
$("#tr").innerHTML=G.slice(0,8).map(card).join("");
$("#st").innerHTML=[[G.length,"Games listed"],[GN.length,"Genres"],[G.filter(x=>!x.p).length,"Free to play"],["4","Platforms"]].map(s=>`<div class="col-6 col-md-3 stat rv"><b>${s[0]}</b>${s[1]}</div>`).join("");
$("#top").innerHTML=[...G].sort((a,b)=>b.r-a.r).slice(0,6).map((g,i)=>`<div class="col-lg-6 rv"><a class="rank" href="game.html?id=${g.id}"><span class="no">${i+1}</span>${pic(g,"s1","")}<div class="flex-grow-1"><h3 class="h5 m-0">${g.n}</h3><small class="mu">${g.g} · ${g.dev}</small><div class="bar mt-2"><i style="width:${g.r*10}%"></i></div></div><b class="stars">${g.r}</b></a></div>`).join("");
reveal();</script></body></html>
